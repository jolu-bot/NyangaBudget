databases:
  - name: nyangabudget-db
    databaseName: nyangabudget
    user: nyangabudget
    plan: free

services:
  - type: web
    name: nyangabudget
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nyangabudget-db
          property: connectionString
