{% extends "base.html" %}

{% block title %}Inscription - NyangaBudget{% endblock %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }
    .register-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }
    .register-card {
        max-width: 500px;
        width: 100%;
    }
</style>

<div class="register-container">
    <div class="register-card">
        <div class="text-center mb-4">
            <h1 class="text-white"><i class="bi bi-piggy-bank-fill"></i> NyangaBudget</h1>
            <p class="text-white">Créez votre compte gratuitement</p>
        </div>

        <div class="card shadow-lg">
            <div class="card-body p-5">
                <h3 class="card-title text-center mb-4">Inscription</h3>

                <form method="POST" action="{{ url_for('register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="nom" class="form-label">
                            <i class="bi bi-person me-2"></i>Nom complet
                        </label>
                        <input type="text" class="form-control form-control-lg" id="nom" name="nom"
                               placeholder="Jean Dupont" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope me-2"></i>Email
                        </label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email"
                               placeholder="jean@example.cm" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock me-2"></i>Mot de passe
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                               placeholder="••••••••" minlength="6" required>
                        <small class="text-muted">Au moins 6 caractères</small>
                    </div>

                    <div class="mb-3">
                        <label for="password_confirm" class="form-label">
                            <i class="bi bi-lock-fill me-2"></i>Confirmer le mot de passe
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password_confirm"
                               name="password_confirm" placeholder="••••••••" minlength="6" required>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 mb-3">
                        <i class="bi bi-person-plus me-2"></i>Créer mon compte
                    </button>

                    <div class="text-center">
                        <p class="mb-0">Vous avez déjà un compte ?
                            <a href="{{ url_for('login') }}" class="text-primary fw-bold">Se connecter</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <p class="text-white">
                <strong>Propulsé par JoYed'S</strong>
            </p>
        </div>
    </div>
</div>
{% endblock %}
